[tool.cibuildwheel]
# cp315 is built in a separate pass with cibuildwheel 4.x (see build-wheels.yml),
# because 4.x dropped Python 3.8 while 3.x doesn't know cp315.
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*"
build-frontend = "build[uv]"
test-command = "pytest {project}/tests/unit"
test-groups = ["test-unit"]

[tool.cibuildwheel.pyodide]
build = "cp314-*"
# https://cibuildwheel.pypa.io/en/stable/platforms/#pyodide
test-command = "python -m pytest {project}/tests/unit"
